<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrology Insights</title>
<link rel="stylesheet" href="./index.css">
</head>

<body>

<div class="container">

<h2>Astrology Insights</h2>

<form id="astroForm">

<label>First Name:</label>
<input type="text" id="name" required>

<label>Surname:</label>
<input type="text" id="surname" required>

<label>Date of Birth (Day):</label>
<input type="number" id="day" min="1" max="31" required>

<label>Month:</label>
<input type="number" id="month" min="1" max="12" required>

<label>Year:</label>
<input type="number" id="year" required>

<button type="submit">Get Insights</button>

</form>

<div id="result" class="result">
<p>Your astrology insights will appear here...</p>
</div>

</div>

<script src="./index.js"></script>

</body>
</html>
